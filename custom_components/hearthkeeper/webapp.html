<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Hearthkeeper</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: var(--tg-theme-bg-color, #fff);
  --text: var(--tg-theme-text-color, #000);
  --hint: var(--tg-theme-hint-color, #999);
  --link: var(--tg-theme-link-color, #2481cc);
  --btn: var(--tg-theme-button-color, #2481cc);
  --btn-text: var(--tg-theme-button-text-color, #fff);
  --sec-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
  --section-bg: var(--tg-theme-section-bg-color, var(--bg));
  --section-header: var(--tg-theme-section-header-text-color, var(--hint));
  --radius: 12px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--sec-bg);
  color: var(--text);
  padding: 16px 12px 24px;
  max-width: 600px;
  margin: 0 auto;
}
h1 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 14px;
  color: var(--hint);
  margin-bottom: 16px;
}
.section {
  background: var(--section-bg);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--section-header);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--sec-bg);
}
.row:last-child { border-bottom: none; }
.row-label { font-size: 15px; }
.row-hint { font-size: 13px; color: var(--hint); margin-top: 1px; }
.action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.action-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px;
  border-radius: 10px;
  background: var(--btn);
  color: var(--btn-text);
  font-size: 14px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: opacity 0.15s;
}
.action-btn:active { opacity: 0.7; }
.toggle {
  width: 44px;
  height: 26px;
  border-radius: 13px;
  background: #ccc;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}
.toggle.on { background: var(--btn); }
.toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s;
}
.toggle.on::after { transform: translateX(18px); }
.badge {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--sec-bg);
  color: var(--hint);
}
#status {
  text-align: center;
  padding: 4px;
  font-size: 13px;
  color: var(--hint);
  margin-bottom: 8px;
}
</style>
</head>
<body>
<div id="status">connecting…</div>
<h1 id="greeting">Hearthkeeper</h1>
<div class="subtitle" id="user-info"></div>

<div class="section">
  <div class="section-title">Quick actions</div>
  <div class="action-grid">
    <button class="action-btn" onclick="sendCmd('/brief')">📅 Briefing</button>
    <button class="action-btn" onclick="sendCmd('/shop')">🛒 Shopping</button>
    <button class="action-btn" onclick="sendCmd('/mail')">✉️ Mail</button>
    <button class="action-btn" onclick="sendCmd('/new')">🔄 New chat</button>
  </div>
</div>

<div class="section">
  <div class="section-title">Chat settings</div>
  <div class="row">
    <div>
      <div class="row-label">Voice replies</div>
      <div class="row-hint">Bot speaks the answer</div>
    </div>
    <div class="toggle" id="voice-toggle" onclick="toggleVoice()"></div>
  </div>
  <div class="row">
    <div>
      <div class="row-label">Agent</div>
      <div class="row-hint" id="current-agent">pipeline</div>
    </div>
    <button class="action-btn" style="padding:6px 14px;font-size:13px" onclick="switchAgent()">Change</button>
  </div>
</div>

<div class="section">
  <div class="section-title">Briefing sources</div>
  <div class="row">
    <div>
      <div class="row-label">Weather</div>
      <div class="row-hint" id="weather-source">not set</div>
    </div>
    <span class="badge" id="weather-status">—</span>
  </div>
  <div class="row">
    <div>
      <div class="row-label">Calendar</div>
      <div class="row-hint" id="calendar-count">0 calendars</div>
    </div>
    <span class="badge" id="calendar-status">—</span>
  </div>
  <div class="row">
    <div>
      <div class="row-label">Mail</div>
      <div class="row-hint" id="mail-count">0 sensors</div>
    </div>
    <span class="badge" id="mail-status">—</span>
  </div>
  <div class="row">
    <div>
      <div class="row-label">Home status</div>
    </div>
    <div class="toggle on" id="home-toggle" onclick="toggleHome()"></div>
  </div>
</div>

<div class="section">
  <div class="section-title">Quiet hours</div>
  <div class="row">
    <div>
      <div class="row-label">Start</div>
    </div>
    <span id="quiet-start" style="font-size:15px">23:00</span>
  </div>
  <div class="row">
    <div>
      <div class="row-label">End</div>
    </div>
    <span id="quiet-end" style="font-size:15px">07:00</span>
  </div>
</div>

<div class="section">
  <div class="section-title">About</div>
  <div class="row">
    <div>
      <div class="row-label">Version</div>
    </div>
    <span class="badge" id="version">0.1.0</span>
  </div>
  <div class="row">
    <div>
      <div class="row-label">Uptime</div>
    </div>
    <span class="badge" id="uptime">—</span>
  </div>
</div>

<script>
(function() {
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const user = tg.initDataUnsafe?.user;
  if (user) {
    document.getElementById('greeting').textContent = 'Hello, ' + (user.first_name || 'there');
    document.getElementById('user-info').textContent = user.id ? 'ID: ' + user.id : '';
  }
  document.getElementById('status').textContent = 'connected';

  function sendCmd(cmd) {
    tg.sendData(cmd);
  }

  // Toggle voice — sendData + update UI
  let voiceOn = false;
  window.toggleVoice = function() {
    voiceOn = !voiceOn;
    document.getElementById('voice-toggle').classList.toggle('on', voiceOn);
    tg.sendData('/voice ' + (voiceOn ? 'on' : 'off'));
  };

  let homeOn = true;
  window.toggleHome = function() {
    homeOn = !homeOn;
    document.getElementById('home-toggle').classList.toggle('on', homeOn);
    // Home status toggle — just a UI hint, options flow is the source of truth
  };

  window.switchAgent = function() {
    tg.sendData('/model');
  };
})();
</script>
</body>
</html>
