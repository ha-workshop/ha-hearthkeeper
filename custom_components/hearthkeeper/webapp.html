<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Hearthkeeper</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0b0f;
  --card:#1c1c1f;
  --card-2:#2a2a2e;
  --sep:rgba(255,255,255,.08);
  --text:#fff;
  --hint:#8e8e93;
  --accent:#8b5cf6;
  --accent-2:#a78bfa;
  --good:#34c759;
  --warn:#ff9f0a;
  --danger:#ff453a;
  --hero-1:#2f6bff;
  --hero-2:#6d3df5;
  --radius:20px;
}
:root[data-theme="light"]{
  --bg:#f2f2f7;
  --card:#fff;
  --card-2:#e9e9ee;
  --sep:rgba(0,0,0,.08);
  --text:#000;
  --hint:#6d6d72;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{
  font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* Hero */
.hero{
  position:relative;padding:12px 16px 56px;
  background:linear-gradient(170deg,var(--hero-1) 0%,var(--hero-2) 70%);
}
.hero::after{
  content:"";position:absolute;inset:auto 0 0 0;height:48px;
  background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none;
}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;
  font-size:15px;font-weight:600;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis;
}
.pill-glass{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(10px)}
.pill-accent{background:linear-gradient(90deg,#8b5cf6,#c026d3);color:#fff}
.pill svg{flex:none}
.mascot{
  display:block;width:96px;height:96px;margin:22px auto 10px;position:relative;z-index:1;padding:0;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,.25));-webkit-tap-highlight-color:transparent;
}
.mascot svg{width:100%;height:100%;overflow:visible}
.mascot{--m-tint:#e8e0ff}
.mascot[data-color="mint"]{--m-tint:#b8f0d8}
.mascot[data-color="peach"]{--m-tint:#ffd6bd}
.mascot[data-color="sky"]{--m-tint:#bfe3ff}
.mascot[data-color="sun"]{--m-tint:#fff0a8}
.mascot[data-color="rose"]{--m-tint:#ffc9dc}
.m-edit{position:absolute;right:2px;bottom:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.28);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35)}
.swatches{display:flex;gap:10px;justify-content:space-between;padding:0 4px}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch.on{border-color:var(--accent)}
.mascot *{transform-box:fill-box;transform-origin:center}
.m-body{animation:m-float 4s ease-in-out infinite}
.m-glow{animation:m-glow 4s ease-in-out infinite;opacity:.8}
.m-eyes{transition:transform .25s ease-out}
.m-eye{transition:transform .08s}
.blink .m-eye{transform:scaleY(.1)}
.m-arcs path,.m-mouth,.m-extra>*{opacity:0;transition:opacity .2s}
.m-smile{opacity:1}
.mascot.bounce .m-body{animation:m-bounce .6s cubic-bezier(.3,1.6,.5,1)}
/* moods */
.mascot[data-mood="happy"] .m-eyes,.mascot[data-mood="sleepy"] .m-eyes{opacity:0}
.mascot[data-mood="happy"] .m-happy,.mascot[data-mood="sleepy"] .m-closed{opacity:1}
.mascot[data-mood="happy"] .m-smile,.mascot[data-mood="sleepy"] .m-smile,
.mascot[data-mood="sad"] .m-smile,.mascot[data-mood="think"] .m-smile,.mascot[data-mood="wow"] .m-smile{opacity:0}
.mascot[data-mood="happy"] .m-grin{opacity:1}
.mascot[data-mood="happy"] .m-heart{opacity:1;animation:m-rise 1.2s ease-out}
.mascot[data-mood="happy"] .m-blush{opacity:.6}
.mascot[data-mood="sleepy"] .m-flat{opacity:1}
.mascot[data-mood="sleepy"] .m-zzz{opacity:.9;animation:m-zzz 2.4s ease-in-out infinite}
.mascot[data-mood="sleepy"] .m-body{animation-duration:6s}
.mascot[data-mood="sleepy"] .m-glow{opacity:.35}
.mascot[data-mood="sad"] .m-sad{opacity:1}
.mascot[data-mood="sad"] .m-eye{transform:scaleY(.75) translateY(1px)}
.mascot[data-mood="think"] .m-flat{opacity:1}
.mascot[data-mood="think"] .m-dots{opacity:1}
.mascot[data-mood="think"] .m-dots circle{animation:m-dot 1.2s ease-in-out infinite}
.mascot[data-mood="think"] .m-dots circle:nth-child(2){animation-delay:.2s}
.mascot[data-mood="think"] .m-dots circle:nth-child(3){animation-delay:.4s}
.mascot[data-mood="wow"] .m-o{opacity:1}
.mascot[data-mood="wow"] .m-eye{transform:scale(1.15)}
@keyframes m-float{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.01,.99)}}
@keyframes m-glow{0%,100%{transform:scale(.95)}50%{transform:scale(1.05)}}
@keyframes m-bounce{0%{transform:scale(1,1)}30%{transform:scale(1.12,.86) translateY(3px)}60%{transform:scale(.94,1.08) translateY(-6px)}100%{transform:scale(1,1)}}
@keyframes m-rise{from{transform:translateY(6px) scale(.6);opacity:0}to{transform:translateY(-4px) scale(1);opacity:1}}
@keyframes m-zzz{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes m-dot{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .mascot *{animation:none!important;transition:none!important}
}
.hello{text-align:center;font-size:28px;font-weight:800;color:#fff;position:relative;z-index:1;letter-spacing:-.3px}
.sub{text-align:center;color:rgba(255,255,255,.75);font-size:14px;margin-top:4px;position:relative;z-index:1}

/* Cards */
.section{padding:0 16px;margin-top:22px}
.section-title{font-size:20px;font-weight:700;margin:0 4px 2px}
.section-desc{color:var(--hint);font-size:14px;margin:0 4px 10px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden}
.hero-card{margin:-30px 16px 0;position:relative;z-index:2}
.banner + .hero-card{margin-top:14px}
.row{
  display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;width:100%;text-align:left;
  position:relative;
}
.row + .row::before{
  content:"";position:absolute;top:0;right:16px;left:56px;height:1px;background:var(--sep);
}
.row.plain + .row.plain::before,.row.plain + .row::before{left:16px}
.row:active{background:var(--card-2)}
.row-icon{width:26px;height:26px;flex:none;display:grid;place-items:center;color:var(--text)}
.row-body{flex:1;min-width:0}
.row-title{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--hint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub.good{color:var(--good)}
.row-sub.good::before{content:"⚡ ";}
.row-value{color:var(--hint);font-size:16px;white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--hint);flex:none}
.row.danger .row-title,.row.danger .row-icon{color:var(--danger)}
.row.link .row-title{color:var(--accent-2);font-weight:600}
.add{
  width:32px;height:32px;flex:none;display:grid;place-items:center;color:var(--text);opacity:.9;
}
.chip{
  display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;margin-left:6px;
  background:rgba(139,92,246,.18);color:var(--accent-2);vertical-align:1px;
}
.chip.off{background:rgba(142,142,147,.18);color:var(--hint)}
.chip.ok{background:rgba(52,199,89,.16);color:var(--good)}
.add.on{color:var(--good)}
.form{padding:4px 4px 0;display:flex;flex-direction:column;gap:10px}
.form label{font-size:13px;color:var(--hint);margin:0 4px -4px}
.form input,.form textarea{width:100%;font:16px/1.35 inherit;font-family:inherit;color:var(--text);background:var(--card-2);border:0;border-radius:12px;padding:12px;color-scheme:inherit}
.form textarea{min-height:110px;resize:vertical}
.form .hint{font-size:12px;color:var(--hint);margin:-4px 4px 0}
.time-row{display:flex;gap:8px;align-items:center}
.time-row input{flex:1;min-width:0}
/* Sub page */
.sub-head{display:flex;align-items:center;gap:6px;padding:16px 12px 4px}
.sub-head h1{font-size:22px;font-weight:800;letter-spacing:-.3px;margin:0}
.sub-back{width:36px;height:36px;display:grid;place-items:center;color:var(--accent-2)}
.sub-back[hidden]{display:none}
.sub-back[hidden] + h1{padding-left:8px}
.subpage .section{margin-top:18px}
.sub-label{font-size:14px;font-weight:600;color:var(--hint);margin:0 16px 6px}
.subpage .note{font-size:12px;margin:6px 16px 0}
.pill-val{background:var(--card-2);border-radius:8px;padding:4px 10px;font-weight:600;font-variant-numeric:tabular-nums}
body.on-sub .tabbar{display:none}
/* Settings, grouped like iOS / Mira: quiet grey headers, compact rows */
#page-settings .page-head{font-size:22px;padding:18px 20px 0}
#page-settings .section{margin-top:20px}
#page-settings .section-title{font-size:14px;font-weight:600;color:var(--hint);margin:0 16px 6px;letter-spacing:.1px}
#page-settings .section-desc{font-size:12px;margin:-4px 16px 8px}
#page-settings .card{border-radius:14px}
#page-settings .row{min-height:46px;padding:9px 16px;gap:12px}
#page-settings .row-title{font-size:16px}
#page-settings .row-sub{font-size:12px}
#page-settings .row-value{font-size:15px}
#page-settings .row-icon{width:24px;height:24px}
#page-settings .row-icon svg{width:22px;height:22px}
#page-settings .row + .row::before{left:52px}
#page-settings .row.plain + .row.plain::before,#page-settings .row.plain + .row::before{left:16px}
#page-settings .account{padding:10px 16px}
#page-settings .note{font-size:12px;margin:6px 16px 0}
.ctile{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.ctile svg{width:20px;height:20px}
.ctile.off{filter:grayscale(1);opacity:.45}
.row:has(.ctile){min-height:62px}
.row:has(.ctile) + .row::before{left:64px}
.row-sub.ok{color:var(--good)}
.row-sub.muted{color:var(--hint)}
.gear{color:var(--hint);flex:none;display:grid;place-items:center;width:32px;height:32px}
.steps{margin:0 4px;padding-left:18px;color:var(--text);font-size:15px;line-height:1.45}
.steps li{margin:4px 0}
.days{display:flex;gap:6px}
.day{flex:1;padding:8px 0;border-radius:10px;background:var(--card-2);color:var(--hint);font-size:13px;font-weight:600;text-align:center}
.day.on{background:var(--accent);color:#fff}
.link-btn{color:var(--accent-2);font-weight:600;font-size:14px;padding:8px 4px;white-space:nowrap}
.form .btn{margin-top:4px}
.quote{background:var(--card);border-radius:12px;padding:12px;font-size:15px;line-height:1.4;white-space:pre-wrap}
.warn-note{font-size:12px;color:var(--hint);margin:2px 4px 0}
.meta{color:var(--hint);font-size:13px;display:flex;align-items:center;gap:4px;margin-top:2px}

/* Grid of quick actions */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{
  background:var(--card);border-radius:18px;padding:14px;min-height:92px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;
}
.tile:active{background:var(--card-2)}
.tile-emoji{font-size:24px}
.tile-title{font-weight:600;font-size:16px}
.tile-sub{color:var(--hint);font-size:12px;margin-top:2px}

/* Tab bar */
.tabbar{
  position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;gap:4px;padding:6px;border-radius:30px;z-index:10;
  background:rgba(30,30,34,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"] .tabbar{background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.06)}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:24px;
  font-size:11px;font-weight:600;color:var(--text);opacity:.9;
}
.tab.active{background:rgba(255,255,255,.1);color:var(--accent-2);opacity:1}
:root[data-theme="light"] .tab.active{background:rgba(0,0,0,.06)}
.tab svg{width:26px;height:26px}

.page{display:none}
.page.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{padding:22px 20px 4px;font-size:30px;font-weight:800;letter-spacing:-.4px}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;
  max-height:80vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
/* While a sheet is open the page under it must not scroll (iOS ignores
   overflow:hidden on body, so the body is pinned in place instead). */
body.sheet-lock{position:fixed;left:0;right:0;overflow:hidden}
.backdrop{touch-action:none}
.sheet.open{transform:none}
.sheet-grip{width:36px;height:5px;border-radius:3px;background:var(--card-2);margin:4px auto 12px}
.sheet-title{font-size:18px;font-weight:700;margin:0 4px 12px}
.check{color:var(--accent-2);font-weight:700}

.toast{
  position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:rgba(40,40,44,.95);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;
  opacity:0;transition:all .2s;z-index:30;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{
  margin:14px 16px 0;padding:12px 14px;border-radius:16px;background:rgba(255,159,10,.14);color:var(--warn);font-size:14px;
}
.empty{color:var(--hint);font-size:14px;padding:14px 16px}
.switch{width:51px;height:31px;border-radius:16px;background:var(--card-2);position:relative;flex:none;transition:background .2s}
.switch span{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--good)}
.switch.on span{transform:translateX(20px)}
.switch-hit{display:flex;flex:none;padding:8px 0 8px 12px;margin:-8px 0}
.row.link .row-icon{color:var(--accent-2)}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px;background:rgba(139,92,246,.18);color:var(--accent-2)}
.time-box{display:flex;gap:10px;padding:14px 16px;align-items:center}
.time-box input{flex:1;min-width:0;font:600 22px/1 inherit;font-family:inherit;color:var(--text);background:var(--card-2);border:0;border-radius:12px;padding:10px 12px;color-scheme:inherit}
.btn{background:var(--accent);color:#fff;font-weight:600;border-radius:12px;padding:12px 18px}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--hero-1),var(--hero-2))}
.account{display:flex;align-items:center;gap:14px;padding:14px 16px}
.account .row-title{font-weight:600}
.note{color:var(--hint);font-size:13px;margin:8px 4px 0}
.foot{color:var(--hint);font-size:12px;text-align:center;margin:22px 0 0}
</style>
</head>
<body>

<!-- ============ Home ============ -->
<main class="page active" id="page-home">
  <header class="hero">
    <div class="topbar">
      <button class="pill pill-glass" id="agent-pill" onclick="openAgents()">
        <span id="agent-pill-name">—</span>
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="pill pill-accent" onclick="backToChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 2-2Z"/></svg>
        <span data-i18n="to_chat"></span>
      </button>
    </div>
    <button class="mascot" id="mascot" type="button" aria-label="Hearthkeeper">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <radialGradient id="face" cx="50%" cy="40%" r="50%">
          <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
          <stop offset="100%" style="stop-color:var(--m-tint)" stop-opacity=".9"/>
        </radialGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ffd59e" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#ffd59e" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle class="m-glow" cx="50" cy="54" r="40" fill="url(#glow)"/>
      <g class="m-body">
        <ellipse cx="50" cy="52" rx="22" ry="20" fill="url(#face)"/>
        <g class="m-eyes">
          <g class="m-eye"><ellipse cx="42" cy="48" rx="3.5" ry="4.5" fill="#1d1b2e"/><circle cx="43.5" cy="46" r="1.5" fill="#fff"/></g>
          <g class="m-eye"><ellipse cx="58" cy="48" rx="3.5" ry="4.5" fill="#1d1b2e"/><circle cx="59.5" cy="46" r="1.5" fill="#fff"/></g>
        </g>
        <g class="m-arcs" fill="none" stroke="#1d1b2e" stroke-width="1.8" stroke-linecap="round">
          <path class="m-happy" d="M38.5 49c1.5-2.6 5.5-2.6 7 0M54.5 49c1.5-2.6 5.5-2.6 7 0"/>
          <path class="m-closed" d="M38.5 48.5c1.5 1.8 5.5 1.8 7 0M54.5 48.5c1.5 1.8 5.5 1.8 7 0"/>
        </g>
        <ellipse class="m-blush" cx="32" cy="54" rx="5" ry="3" fill="#ff8a8a" opacity=".3"/>
        <ellipse class="m-blush" cx="68" cy="54" rx="5" ry="3" fill="#ff8a8a" opacity=".3"/>
        <g fill="none" stroke="#1d1b2e" stroke-width="1.5" stroke-linecap="round">
          <path class="m-mouth m-smile" d="M42 56c2 3 5 4 8 4s6-1 8-4"/>
          <path class="m-mouth m-grin" d="M42 56c2 5 5 6 8 6s6-1 8-6Z" fill="#ff6b81" stroke-linejoin="round"/>
          <path class="m-mouth m-flat" d="M45 59h10"/>
          <path class="m-mouth m-sad" d="M43 61c2-3 4.5-4 7-4s5 1 7 4"/>
          <ellipse class="m-mouth m-o" cx="50" cy="59" rx="2.6" ry="3" fill="#1d1b2e" stroke="none"/>
        </g>
      </g>
      <g class="m-extra" fill="#fff" font-family="inherit" font-weight="700">
        <text class="m-zzz" x="72" y="34" font-size="9">z<tspan dx="1" dy="-5" font-size="7">z</tspan></text>
        <g class="m-dots"><circle cx="74" cy="34" r="2"/><circle cx="80" cy="28" r="2.4"/><circle cx="87" cy="21" r="2.8"/></g>
        <path class="m-heart" d="M78 30c-2-3-7-2-6 2 .6 2.4 6 6 6 6s5.4-3.6 6-6c1-4-4-5-6-2Z" fill="#ff6b81"/>
      </g>
    </svg>
    <span class="m-edit" id="mascot-edit" role="button" aria-label="edit"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.83 2.83 0 0 0-4-4L4 16Z"/></svg></span>
    </button>
    <h1 class="hello" id="hello"></h1>
    <p class="sub" id="hello-sub"></p>

  function inQuietHours(start, end) {
    if (!start || !end) return false;
    const m = s => { const [h, mm] = s.split(":").map(Number); return h * 60 + mm; };
    const d = new Date(), now = d.getHours() * 60 + d.getMinutes(), a = m(start), b = m(end);
    return a <= b ? now >= a && now < b : now >= a || now < b;
  }

  async function api(action, extra) {
    const busy = !["state", "connections", "shared", "preview_connection"].includes(action);
    if (busy) Mascot.mood("think");
    try {
      const data = await rawApi(action, extra);
      if (busy) Mascot.mood("happy", 1400);
      return data;
    } catch (err) {
      if (busy) Mascot.mood("sad", 1800);
      throw err;
    }
  }
  async function rawApi(action, extra) {
    if (preview) return demoApi(action, extra);
    const res = await fetch(API, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(Object.assign({init_data: initData, action}, extra || {})),
    });
    const data = await res.json().catch(() => ({ok: false, error: "error"}));
    if (!res.ok || !data.ok) throw new Error(data.error || "error");
    return data;
  }
  function fail(err) {
    const code = err && err.message;
    toast(code === "no_tts" ? t("no_tts") : code === "unauthorized" ? t("unauthorized") : code === "bad_value" ? t("bad_value") : t("error"));

  async function apply(promise) {
    try { const data = await promise; if (data.state) { state = data.state; render(); drawSub(); } haptic("ok"); return true; }
    catch (err) { fail(err); render(); return false; }
  }
  async function runCommand(command, args) {

  let sub = null;
  const nativeBack = () => !!(tg && tg.BackButton && !preview);

    $("sub-body").innerHTML = page.html;

  function closePage() {
    if (!sub) return;
    mailEditing = false; calAdding = false;

        <button type="button" class="link-btn" data-act="${check}">${esc(t("plugin_check"))}</button></div></div>
        <p class="note">${esc(t("plugin_note"))}</p></section>` +
      (draftPlugin ? pluginCard(draftPlugin) + `<section class="section"><div class="form"><button class="btn" data-act="${add}">${esc(t("plugin_add"))}</button></div></section>` : "")};
  }
  async function afterReload() {
    // The integration reloads; poll until it answers with the new state.
    for (let i = 0; i < 10; i++) {
      await new Promise(r => setTimeout(r, 1500));
      try { const d = await rawApi("state"); state = d.state; plugins = null; render(); return; } catch (e) {}
    }
  }
  function openShared(name) {
    openSheet(name, `<div class="form"><p class="note" style="margin:0 4px">${esc(t("shared_note"))}</p>
      <button class="btn" data-act="${register(() => openLink(HA_LINKS.hearthkeeper))}">${esc(t("how_hk"))}</button></div>`);
  }
  function openHowTo(key, name) {
    openSheet(t("how_title", {name}), `<div class="form"><ol class="steps">
      <li>${esc(t("how_" + key))}</li><li>${esc(t("how_then"))}</li></ol>
      <button class="btn" data-act="${register(() => openLink(HA_LINKS[key]))}">${esc(t("how_ha"))}</button>
      <button class="link-btn" data-act="${register(() => openLink(HA_LINKS.hearthkeeper))}">${esc(t("how_hk"))}</button></div>`);
  }

  // ---------- custom skills ----------
  const mySkills = () => state.custom_skills || [];
  const sparkle = ICON.sparkle("var(--accent-2)");
  function ago(iso) {
    if (!iso) return "";
    const d = new Date(iso), now = new Date();
    const days = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
    return days <= 0 ? t("ago_today") : days === 1 ? t("ago_yesterday") : t("ago_days", {n: days});
  }
  const SKILLS_MAX = 20;
  function scheduleLabel(time, days) {
    if (!time) return t("skill_manual");
    const d = (days || []).slice().sort().join(",");
    if (!d) return t("skill_daily", {time});
    if (d === "0,1,2,3,4") return t("skill_weekdays", {time});
    if (d === "5,6") return t("skill_weekend", {time});
    const names = t("days_short").split(",");
    return t("skill_on_days", {time, days: days.slice().sort().map(i => names[i]).join(", ")});
  }
  function skillSub(sk) {
    const parts = [scheduleLabel(sk.time, sk.days)];
    if (sk.last_run) parts.push(t("skill_ran", {when: ago(sk.last_run)}));
    return parts.join(" · ");
  }
  // Built-in templates: adding one copies it into "My skills".
  const READY_SKILLS = [
    {id: "breakfast", cat: "food", time: "07:30",
     name: {ru: "Рецепт завтрака", en: "Breakfast recipe"},
     desc: {ru: "Простой завтрак на 15 минут", en: "A simple 15-minute breakfast"},
     prompt: {ru: "Предложи один простой рецепт завтрака, который готовится не дольше 15 минут. Список продуктов и 3–5 шагов, без вступления.",
              en: "Suggest one simple breakfast recipe that takes no more than 15 minutes. List the ingredients and 3–5 steps, no introduction."}},
    {id: "dinner", cat: "food", time: "17:00",
     name: {ru: "Что приготовить на ужин", en: "What's for dinner"},
     desc: {ru: "Идея ужина на семью", en: "A family dinner idea"},
     prompt: {ru: "Предложи идею ужина на семью из обычных продуктов: название, список покупок и короткий план готовки.",
              en: "Suggest a family dinner from everyday groceries: the dish, a shopping list and a short cooking plan."}},
    {id: "joke", cat: "fun", time: "09:00",
     name: {ru: "Шутка дня", en: "Joke of the day"},
     desc: {ru: "Добрая шутка для всей семьи", en: "A kind joke for the whole family"},
     prompt: {ru: "Расскажи одну добрую короткую шутку, подходящую для всей семьи. Только шутку, без пояснений.",
              en: "Tell one short, kind joke suitable for the whole family. Only the joke, no explanation."}},
    {id: "fact", cat: "learn", time: "12:00",
     name: {ru: "Факт дня", en: "Fact of the day"},
     desc: {ru: "Интересный факт в двух предложениях", en: "An interesting fact in two sentences"},
     prompt: {ru: "Расскажи один интересный и проверенный научный факт в двух-трёх предложениях.",
              en: "Share one interesting, well-established science fact in two or three sentences."}},
    {id: "english-word", cat: "learn", time: "08:30", days: [0, 1, 2, 3, 4],
     name: {ru: "Английское слово дня", en: "Word of the day"},
     desc: {ru: "Слово, перевод и пример — по будням", en: "A word, its meaning and an example — on weekdays"},
     prompt: {ru: "Дай одно полезное английское слово уровня B1–B2: транскрипцию, перевод на русский и два примера предложений.",
              en: "Give one useful English word at B1–B2 level: pronunciation, meaning and two example sentences."}},
    {id: "motivation", cat: "mood", time: "08:00",
     name: {ru: "Мотивация на день", en: "Daily motivation"},
     desc: {ru: "Короткая мысль на утро", en: "A short thought for the morning"},
     prompt: {ru: "Напиши одну короткую мотивирующую мысль на день, без пафоса и без цитат известных людей.",
              en: "Write one short motivating thought for the day, without clichés or famous quotes."}},
    {id: "weekend-ideas", cat: "family", time: "18:00", days: [4],
     name: {ru: "Чем заняться в выходные", en: "Weekend ideas"},
     desc: {ru: "Три идеи для семьи — по пятницам", en: "Three family ideas — on Fridays"},
     prompt: {ru: "Предложи три идеи, чем заняться семье в выходные: одну дома, одну на улице и одну бюджетную поездку недалеко.",
              en: "Suggest three things a family can do this weekend: one at home, one outdoors and one cheap trip nearby."}},
  ];
  const pick = m => m[lang] || m.en;
  function renderReadySkills() {
    const have = new Set(mySkills().map(sk => sk.prompt));
    $("ready-skills").innerHTML = READY_SKILLS.map(item => {
      const added = have.has(pick(item.prompt));
      const open = register(e => { e.stopPropagation(); openReadySkill(item); });
      return row({title: esc(pick(item.name)) + `<span class="chip">${esc(t("cat_" + item.cat))}</span>`,
        sub: esc(pick(item.desc)),
        right: added ? `<span class="add on">${ICON.line('<path d="m5 12 5 5 9-10"/>')}</span>`
                     : `<span class="add" role="button" aria-label="${esc(t("add_skill"))}" data-act="${open}">${ICON.line(P.plus)}</span>`,
        onClick: () => openReadySkill(item)});
    }).join("");
  }
  function openReadySkill(item) {
    if (mySkills().length >= SKILLS_MAX) { toast(t("skills_limit", {n: SKILLS_MAX})); return; }
    const add = register(() => {
      closeSheet();
      saveSkill(null, {name: pick(item.name), prompt: pick(item.prompt), time: item.time || "", days: item.days || [], enabled: true},
                t("skill_added"));
    });
    openSheet(pick(item.name), `<div class="form">
      <p class="note" style="margin:0 4px">${esc(pick(item.desc))}</p>
      <label>${esc(t("skill_prompt"))}</label><div class="quote">${esc(pick(item.prompt))}</div>
      <p class="hint">${esc(scheduleLabel(item.time, item.days))}</p>
      <p class="warn-note">${esc(t("skill_warn"))}</p>
      <button class="btn" data-act="${add}">${esc(t("add_skill"))}</button></div>`);
  }

  function renderMySkills() {
    const list = mySkills();
    let html = row({icon: ICON.line(P.plus), title: esc(t("create_skill")), cls: "link", chev: true,
                    onClick: () => mySkills().length >= SKILLS_MAX ? toast(t("skills_limit", {n: SKILLS_MAX})) : openSkillForm(null)});
    html += list.length ? list.map(sk => {
      const run = register(e => { e.stopPropagation(); runSkill(sk); });
      return row({icon: sparkle, title: esc(sk.name), sub: esc(skillSub(sk)),
        right: `<span class="add" role="button" aria-label="${esc(t("run_now"))}" data-act="${run}">${ICON.play}</span>`,
        onClick: () => openSkillForm(sk)});
    }).join("") : row({title: esc(t("no_skills"))});
    $("my-skills").innerHTML = html;
  }
  function openSkillForm(sk) {
    const save = register(() => {
      const name = $("skill-name").value.trim(), prompt = $("skill-prompt").value.trim();
      const time = $("skill-time").value.slice(0, 5);
      const days = [...document.querySelectorAll("#skill-days .day.on")].map(b => +b.dataset.day);
      if (!name || !prompt) { toast(t("need_fields")); return; }
      closeSheet();
      saveSkill(sk, {name, prompt, time, days: days.length === 7 ? [] : days, enabled: sk ? sk.enabled : true},
                sk ? t("saved") : t("skill_added"));
    });
    let extra = "";
    if (sk) {
      extra =
        (sk.time ? row({icon: ICON.line(P.bell), title: esc(t("skill_enabled")), right: sw(sk.enabled),
                        onClick: () => { closeSheet(); saveSkill(sk, {enabled: !sk.enabled}, null); }}) : "") +
        row({icon: ICON.play, title: esc(t("run_now")), onClick: () => { closeSheet(); runSkill(sk); }}) +
        row({icon: ICON.line(P.trash), title: esc(t("delete_skill")), cls: "danger", onClick: () => {
          closeSheet();
          const go = () => setPrefs({skills: mySkills().filter(x => x.id !== sk.id)}, true);
          const q = t("confirm_delete_skill", {name: sk.name});
          if (tg && tg.showConfirm && !preview) tg.showConfirm(q, ok => ok && go()); else go();
        }});
    }
    openSheet(sk ? sk.name : t("create_skill"), `<div class="form">
      <label for="skill-name">${esc(t("skill_name"))}</label>
      <input id="skill-name" maxlength="40" value="${esc(sk ? sk.name : "")}" placeholder="${esc(t("skill_name_ph"))}">
      <label for="skill-prompt">${esc(t("skill_prompt"))}</label>
      <textarea id="skill-prompt" maxlength="600" placeholder="${esc(t("skill_prompt_ph"))}">${esc(sk ? sk.prompt : "")}</textarea>
      <label for="skill-time">${esc(t("skill_time"))}</label>
      <div class="time-row"><input id="skill-time" type="time" value="${esc(sk ? sk.time : "")}">
        <button type="button" class="link-btn" data-act="${register(() => { $("skill-time").value = ""; })}">${esc(t("skill_no_time"))}</button></div>
      <p class="hint">${esc(t("skill_time_hint"))}</p>
      <label>${esc(t("skill_days"))}</label>
      <div class="days" id="skill-days">${t("days_short").split(",").map((n, i) =>
        `<button type="button" class="day ${sk && (sk.days || []).includes(i) ? "on" : ""}" data-day="${i}"
          aria-pressed="${sk && (sk.days || []).includes(i) ? "true" : "false"}"
          data-act="${register(e => { const b = e.target.closest(".day"); const on = b.classList.toggle("on"); b.setAttribute("aria-pressed", on); })}">${esc(n)}</button>`).join("")}</div>
      <p class="hint">${esc(t("skill_days_hint"))}</p>
      <button class="btn" data-act="${save}">${esc(t("save"))}</button></div>
      ${extra ? `<div class="card" style="margin-top:16px">${extra}</div>` : ""}`);
  }
  function saveSkill(sk, patch, okText) {
    const list = mySkills().map(x => ({...x}));
    if (sk) { const i = list.findIndex(x => x.id === sk.id); if (i >= 0) list[i] = {...list[i], ...patch}; }
    else list.push(patch);
    return setPrefs({skills: list.map(({last_run, ...rest}) => rest)}, true).then(ok => { if (ok && okText) toast(okText); return ok; });
  }
  async function runSkill(sk) {
    try { await api("run_skill", {id: sk.id}); haptic("ok"); toast(t("skill_sent")); }
    catch (err) { fail(err); }
  }

  function openText(title, value, onSave) {
    const id = register(() => { const v = $("text-input").value; closeSheet(); if (v) onSave(v.trim()); });
    openSheet(title, `<div class="time-box"><input type="text" id="text-input" value="${esc(value || "")}" maxlength="40" placeholder="${esc(t("brief_name_ph"))}">
      <button class="btn" data-act="${id}">${esc(t("save"))}</button></div>`);
  }
  function openTime(title, value, onSave) {
    const id = register(() => { const v = $("time-input").value; closeSheet(); if (v && v !== value) onSave(v.slice(0, 5)); });
    openSheet(title, `<div class="time-box"><input type="time" id="time-input" value="${esc(value || "")}">
      <button class="btn" data-act="${id}">${esc(t("save"))}</button></div>`);
  }
  function openWeather() {
    const items = [{id: null, name: t("none")}].concat(state.choices.weather);
    openSheet(t("weather"), items.map(w => row({
      title: esc(w.name),
      right: w.id === (state.sources.weather_id || null) ? '<span class="check">✓</span>' : "",
      onClick: async () => { closeSheet(); await setPrefs({weather: w.id}); },
    })).join(""));
  }
  function openMulti(key, title, choices, selected) {
    if (!choices.length) { openSheet(title, `<div class="empty">${esc(t("pool_empty"))}</div>`); return; }
    openSheet(title, choices.map(c => row({
      title: esc(c.name),
      right: selected.includes(c.id) ? '<span class="check">✓</span>' : "",
      onClick: async () => {
        const next = selected.includes(c.id) ? selected.filter(x => x !== c.id) : selected.concat(c.id);
        if (await apply(api("set_prefs", {prefs: {[key]: next}}))) {
          openMulti(key, title, choices, key === "mail" ? state.sources.mail_ids : state.sources.calendar_ids);
        }
      },
    })).join(""));
  }

  let lockedY = null;
  function lockScroll() {
    if (lockedY !== null) return;
    lockedY = window.scrollY;
    document.body.style.top = `-${lockedY}px`;
    document.body.classList.add("sheet-lock");
    try { tg && tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  }
  function unlockScroll() {
    if (lockedY === null) return;
    document.body.classList.remove("sheet-lock");
    document.body.style.top = "";
    window.scrollTo(0, lockedY);
    lockedY = null;
    try { tg && tg.enableVerticalSwipes && tg.enableVerticalSwipes(); } catch (e) {}
  }
  function openSheet(title, html) {
    $("sheet-title").textContent = title; $("sheet-body").innerHTML = html;
    $("sheet").scrollTop = 0;
    $("backdrop").classList.add("open"); $("sheet").classList.add("open");
    lockScroll();
  }
  function closeSheet() {
    $("backdrop").classList.remove("open"); $("sheet").classList.remove("open");
    unlockScroll();
  }
  window.closeSheet = closeSheet;

  function openModes() {
    const html = state.reply_modes.map(m => row({
      title: esc(modeName(m)),
      right: m === state.reply_mode ? '<span class="check">✓</span>' : "",
      onClick: async () => { closeSheet(); if (m !== state.reply_mode) await apply(api("set_reply_mode", {mode: m})); },
    })).join("");
    openSheet(t("reply_mode"), html);
  }
  window.openAgents = function () {
    if (!state) return;
    const items = [{id: null, name: t("agent_default") + (state.agent.pipeline_name ? " · " + state.agent.pipeline_name : "")}]
      .concat(state.agents);
    const html = items.map(a => row({
      title: esc(a.name),
      right: (a.id === null ? !state.agent.overridden : state.agent.overridden && a.id === state.agent.id) ? '<span class="check">✓</span>' : "",
      onClick: async () => { closeSheet(); await apply(api("set_agent", {agent_id: a.id})); },
    })).join("");
    openSheet(t("agent"), html);
  };
  window.backToChat = function () { if (tg && !preview) tg.close(); };

  // ---------- tabs ----------
  $("tabbar").addEventListener("click", e => {
    const btn = e.target.closest(".tab"); if (!btn) return;
    haptic();
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "page-" + btn.dataset.tab));
    window.scrollTo(0, 0);
  });

  // ---------- theme & start ----------
  function applyTheme() {
    const scheme = tg && tg.colorScheme ? tg.colorScheme
      : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.dataset.theme = scheme;
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    try { tg && tg.setHeaderColor && tg.setHeaderColor("#2f6bff"); tg && tg.setBackgroundColor && tg.setBackgroundColor(bg); } catch (e) {}
  }
  if (tg) {
    tg.ready(); tg.expand();
    tg.onEvent && tg.onEvent("themeChanged", () => { applyTheme(); backgroundRefresh(); });
    // No refresh on viewportChanged: the on-screen keyboard resizes the
    // viewport, and re-rendering then would destroy the focused field and
    // close the keyboard at once.
    tg.onEvent && tg.onEvent("activated", backgroundRefresh);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) backgroundRefresh(); });
  function backgroundRefresh() {
    const el = document.activeElement;
    // Never redraw under someone typing or with a sheet open.
    if (!state || (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) || $("sheet").classList.contains("open")
        || calAdding || mailEditing || (sub && sub.build === addPluginPage)) return;
    rawApi("state").then(data => { state = data.state; render(); drawSub(); }).catch(() => {});
  }
  applyTheme();

  api("state").then(data => { state = data.state; render(); }).catch(err => {
    // Never show sample data as if it were the user's: render an empty state
    // and say why.
    state = {
      first_name: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || "",
      language: DEMO.language, bot_username: null, reply_mode: "text", reply_modes: [],
      tts: false, stt: false, pipeline: null,
      agent: {id: null, name: null, overridden: false, pipeline_name: null}, agents: [],
      personal: false,
      briefings: [],
      brief: {active: [], quiet_start: "", quiet_end: "", has_personal_briefings: false, personal_quiet: false},
      sources: {weather: null, weather_id: null, calendars: [], calendar_ids: [], todo: null, mail: false, mail_ids: [], home: false, personal: false},
      choices: {weather: [], calendars: [], mail: []},
      shared: {max_voice_seconds: 0, keep_audio: false, allow_cloud_for_mail: false},
      account: {id: 0, name: "", username: null}, reminders: [],
    };
    render();
    const banner = $("preview-banner");
    banner.hidden = false;
    banner.textContent = err && err.message === "unauthorized" ? t("unauthorized") : t("error");
  });
})();
</script>
</body>
</html>
