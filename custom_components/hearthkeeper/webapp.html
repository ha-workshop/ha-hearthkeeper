<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Hearthkeeper</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b0b0f;
  --card:#1c1c1f;
  --card-2:#2a2a2e;
  --sep:rgba(255,255,255,.08);
  --text:#fff;
  --hint:#8e8e93;
  --accent:#8b5cf6;
  --accent-2:#a78bfa;
  --good:#34c759;
  --warn:#ff9f0a;
  --danger:#ff453a;
  --hero-1:#2f6bff;
  --hero-2:#6d3df5;
  --radius:20px;
}
:root[data-theme="light"]{
  --bg:#f2f2f7;
  --card:#fff;
  --card-2:#e9e9ee;
  --sep:rgba(0,0,0,.08);
  --text:#000;
  --hint:#6d6d72;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{
  font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* Hero */
.hero{
  position:relative;padding:12px 16px 56px;
  background:linear-gradient(170deg,var(--hero-1) 0%,var(--hero-2) 70%);
}
.hero::after{
  content:"";position:absolute;inset:auto 0 0 0;height:48px;
  background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none;
}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;
  font-size:15px;font-weight:600;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis;
}
.pill-glass{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(10px)}
.pill-accent{background:linear-gradient(90deg,#8b5cf6,#c026d3);color:#fff}
.pill svg{flex:none}
.mascot{
  width:96px;height:96px;margin:22px auto 10px;position:relative;z-index:1;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,.25));
}
.hello{text-align:center;font-size:28px;font-weight:800;color:#fff;position:relative;z-index:1;letter-spacing:-.3px}
.sub{text-align:center;color:rgba(255,255,255,.75);font-size:14px;margin-top:4px;position:relative;z-index:1}

/* Cards */
.section{padding:0 16px;margin-top:22px}
.section-title{font-size:20px;font-weight:700;margin:0 4px 2px}
.section-desc{color:var(--hint);font-size:14px;margin:0 4px 10px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden}
.hero-card{margin:-30px 16px 0;position:relative;z-index:2}
.banner + .hero-card{margin-top:14px}
.row{
  display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;width:100%;text-align:left;
  position:relative;
}
.row + .row::before{
  content:"";position:absolute;top:0;right:16px;left:56px;height:1px;background:var(--sep);
}
.row.plain + .row.plain::before,.row.plain + .row::before{left:16px}
.row:active{background:var(--card-2)}
.row-icon{width:26px;height:26px;flex:none;display:grid;place-items:center;color:var(--text)}
.row-body{flex:1;min-width:0}
.row-title{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--hint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub.good{color:var(--good)}
.row-sub.good::before{content:"⚡ ";}
.row-value{color:var(--hint);font-size:16px;white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--hint);flex:none}
.row.danger .row-title,.row.danger .row-icon{color:var(--danger)}
.row.link .row-title{color:var(--accent-2);font-weight:600}
.add{
  width:32px;height:32px;flex:none;display:grid;place-items:center;color:var(--text);opacity:.9;
}
.chip{
  display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;margin-left:6px;
  background:rgba(139,92,246,.18);color:var(--accent-2);vertical-align:1px;
}
.chip.off{background:rgba(142,142,147,.18);color:var(--hint)}
.chip.ok{background:rgba(52,199,89,.16);color:var(--good)}
.meta{color:var(--hint);font-size:13px;display:flex;align-items:center;gap:4px;margin-top:2px}

/* Grid of quick actions */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{
  background:var(--card);border-radius:18px;padding:14px;min-height:92px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;
}
.tile:active{background:var(--card-2)}
.tile-emoji{font-size:24px}
.tile-title{font-weight:600;font-size:16px}
.tile-sub{color:var(--hint);font-size:12px;margin-top:2px}

/* Tab bar */
.tabbar{
  position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;gap:4px;padding:6px;border-radius:30px;z-index:10;
  background:rgba(30,30,34,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"] .tabbar{background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.06)}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:24px;
  font-size:11px;font-weight:600;color:var(--text);opacity:.9;
}
.tab.active{background:rgba(255,255,255,.1);color:var(--accent-2);opacity:1}
:root[data-theme="light"] .tab.active{background:rgba(0,0,0,.06)}
.tab svg{width:26px;height:26px}

.page{display:none}
.page.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{padding:22px 20px 4px;font-size:30px;font-weight:800;letter-spacing:-.4px}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;
  max-height:80vh;overflow:auto;
}
.sheet.open{transform:none}
.sheet-grip{width:36px;height:5px;border-radius:3px;background:var(--card-2);margin:4px auto 12px}
.sheet-title{font-size:18px;font-weight:700;margin:0 4px 12px}
.check{color:var(--accent-2);font-weight:700}

.toast{
  position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:rgba(40,40,44,.95);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;
  opacity:0;transition:all .2s;z-index:30;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{
  margin:14px 16px 0;padding:12px 14px;border-radius:16px;background:rgba(255,159,10,.14);color:var(--warn);font-size:14px;
}
.empty{color:var(--hint);font-size:14px;padding:14px 16px}
.switch{width:51px;height:31px;border-radius:16px;background:var(--card-2);position:relative;flex:none;transition:background .2s}
.switch span{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--good)}
.switch.on span{transform:translateX(20px)}
.switch-hit{display:flex;flex:none;padding:8px 0 8px 12px;margin:-8px 0}
.row.link .row-icon{color:var(--accent-2)}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px;background:rgba(139,92,246,.18);color:var(--accent-2)}
.time-box{display:flex;gap:10px;padding:14px 16px;align-items:center}
.time-box input{flex:1;min-width:0;font:600 22px/1 inherit;font-family:inherit;color:var(--text);background:var(--card-2);border:0;border-radius:12px;padding:10px 12px;color-scheme:inherit}
.btn{background:var(--accent);color:#fff;font-weight:600;border-radius:12px;padding:12px 18px}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--hero-1),var(--hero-2))}
.account{display:flex;align-items:center;gap:14px;padding:14px 16px}
.account .row-title{font-weight:600}
.note{color:var(--hint);font-size:13px;margin:8px 4px 0}
.foot{color:var(--hint);font-size:12px;text-align:center;margin:22px 0 0}
</style>
</head>
<body>

<!-- ============ Home ============ -->
<main class="page active" id="page-home">
  <header class="hero">
    <div class="topbar">
      <button class="pill pill-glass" id="agent-pill" onclick="openAgents()">
        <span id="agent-pill-name">—</span>
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="pill pill-accent" onclick="backToChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 2-2Z"/></svg>
        <span data-i18n="to_chat"></span>
      </button>
    </div>
    <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <radialGradient id="face" cx="50%" cy="40%" r="50%">
          <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#e8e0ff" stop-opacity=".85"/>
        </radialGradient>
      </defs>
      <!-- face -->
      <ellipse cx="50" cy="52" rx="22" ry="20" fill="url(#face)"/>
      <!-- eyes -->
      <ellipse cx="42" cy="48" rx="3.5" ry="4.5" fill="#1d1b2e"/>
      <ellipse cx="58" cy="48" rx="3.5" ry="4.5" fill="#1d1b2e"/>
      <!-- eye shine -->
      <circle cx="43.5" cy="46" r="1.5" fill="#fff"/>
      <circle cx="59.5" cy="46" r="1.5" fill="#fff"/>
      <!-- blush -->
      <ellipse cx="32" cy="54" rx="5" ry="3" fill="#ff8a8a" opacity=".3"/>
      <ellipse cx="68" cy="54" rx="5" ry="3" fill="#ff8a8a" opacity=".3"/>
      <!-- smile -->
      <path d="M42 56c2 3 5 4 8 4s6-1 8-4" fill="none" stroke="#1d1b2e" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <h1 class="hello" id="hello"></h1>
    <p class="sub" id="hello-sub"></p>
  </header>

  <div id="preview-banner" class="banner" hidden data-i18n="preview"></div>

  <div class="card hero-card" id="highlights"></div>

  <section class="section">
    <h2 class="section-title" data-i18n="quick"></h2>
    <p class="section-desc" data-i18n="quick_desc"></p>
    <div class="grid" id="quick"></div>
  </section>

  <section class="section">
    <h2 class="section-title" data-i18n="reminders"></h2>
    <p class="section-desc" data-i18n="reminders_desc"></p>
    <div class="card" id="reminders"></div>
  </section>
</main>

<!-- ============ Skills ============ -->
<main class="page" id="page-skills">
  <h1 class="page-head" data-i18n="tab_skills"></h1>
  <section class="section" style="margin-top:8px">
    <p class="section-desc" data-i18n="skills_desc"></p>
    <div class="card" id="skills"></div>
  </section>
</main>

<!-- ============ Home state ============ -->
<main class="page" id="page-house">
  <h1 class="page-head" data-i18n="tab_house"></h1>
  <section class="section" style="margin-top:8px">
    <h2 class="section-title" data-i18n="sources"></h2>
    <p class="section-desc" data-i18n="sources_desc"></p>
    <div class="card" id="sources"></div>
  </section>
  <section class="section">
    <h2 class="section-title" data-i18n="schedule"></h2>
    <p class="section-desc" data-i18n="schedule_desc"></p>
    <div class="card" id="schedule"></div>
  </section>
</main>

<!-- ============ Settings ============ -->
<main class="page" id="page-settings">
  <h1 class="page-head" data-i18n="tab_settings"></h1>
  <section class="section" style="margin-top:8px">
    <div class="card" id="settings-account"></div>
    <p class="note" data-i18n="account_note"></p>
  </section>
  <section class="section">
    <h2 class="section-title" data-i18n="chat"></h2>
    <div class="card" id="settings-chat"></div>
  </section>
  <section class="section">
    <h2 class="section-title" data-i18n="my_brief"></h2>
    <p class="section-desc" data-i18n="my_brief_desc"></p>
    <div class="card" id="settings-brief"></div>
  </section>
  <section class="section">
    <h2 class="section-title" data-i18n="my_quiet"></h2>
    <p class="section-desc" data-i18n="my_quiet_desc"></p>
    <div class="card" id="settings-quiet"></div>
  </section>
  <section class="section">
    <h2 class="section-title" data-i18n="shared"></h2>
    <p class="section-desc" data-i18n="shared_desc"></p>
    <div class="card" id="settings-voice"></div>
  </section>
  <section class="section">
    <h2 class="section-title" data-i18n="app"></h2>
    <div class="card" id="settings-app"></div>
  </section>
  <p class="foot">Hearthkeeper</p>
</main>

<!-- Tab bar -->
<nav class="tabbar" id="tabbar">
  <button class="tab active" data-tab="home">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3 10.4V20a1 1 0 0 0 1 1h5.5v-6h5v6H20a1 1 0 0 0 1-1v-9.6Z"/></svg>
    <span data-i18n="tab_home"></span>
  </button>
  <button class="tab" data-tab="skills">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 20 10-10M14 4v3M14 13v3M10 8H7M21 8h-3M17 5l-1.5 1.5M17 11l-1.5-1.5"/></svg>
    <span data-i18n="tab_skills"></span>
  </button>
  <button class="tab" data-tab="house">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg>
    <span data-i18n="tab_house"></span>
  </button>
  <button class="tab" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    <span data-i18n="tab_settings"></span>
  </button>
</nav>

<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-grip"></div>
  <h3 class="sheet-title" id="sheet-title"></h3>
  <div class="card" id="sheet-body"></div>
</div>
<div class="toast" id="toast"></div>

  // ---------- API ----------

    briefHtml += row({icon: ICON.line(P.plus), title: esc(t("add_briefing")), cls: "link", chev: true,
      onClick: openAddBriefing});

    briefHtml += row({icon: ICON.line(P.sun), title: esc(t("weather")) + mine(src.personal), value: esc(src.weather || t("none")), chev: true,
      onClick: openWeather});
    briefHtml += row({icon: ICON.line(P.cal), title: esc(t("calendars")), value: esc(ids.length ? t("cal_n", {n: ids.length}) : t("none")), chev: true,
      onClick: () => openMulti("calendars", t("calendars"), state.choices.calendars, ids)});
    briefHtml += row({icon: ICON.line(P.mail), title: esc(t("mail")), value: esc(mailIds.length ? t("cal_n", {n: mailIds.length}) : t("none")), chev: true,
      onClick: () => openMulti("mail", t("mail"), state.choices.mail, mailIds)});
    briefHtml += row({icon: ICON.line(P.house), title: esc(t("home_state")), right: sw(src.home),
      onClick: () => setPrefs({home: !src.home}, true)});
    $("settings-brief").innerHTML = briefHtml;

    const quietOn = !!(state.brief.quiet_start && state.brief.quiet_end);
    $("settings-quiet").innerHTML =
      row({icon: ICON.line(P.moon), title: esc(t("quiet_on")) + mine(state.brief.personal_quiet), right: sw(quietOn),
           onClick: () => setPrefs({quiet: quietOn ? [] : ["23:00", "07:00"]}, true)}) +
      (quietOn
        ? row({icon: ICON.line(P.clock), title: esc(t("from")), value: esc(state.brief.quiet_start), chev: true,
               onClick: () => openTime(t("from"), state.brief.quiet_start, v => setPrefs({quiet: [v, state.brief.quiet_end]}))}) +
          row({icon: ICON.line(P.clock), title: esc(t("to")), value: esc(state.brief.quiet_end), chev: true,
               onClick: () => openTime(t("to"), state.brief.quiet_end, v => setPrefs({quiet: [state.brief.quiet_start, v]}))})
        : "");

    $("settings-chat").innerHTML =
      row({icon: ICON.line(P.agent), title: esc(t("agent")), value: esc(state.agent.overridden ? state.agent.name : t("agent_default")), chev: true, onClick: openAgents}) +
      row({icon: ICON.line(P.mode), title: esc(t("reply_mode")), value: esc(modeName(state.reply_mode)), chev: true, onClick: openModes}) +
      row({icon: ICON.line(P.refresh), title: esc(t("new_conv")), chev: true, onClick: newConversation});
    $("settings-voice").innerHTML =
      row({icon: ICON.line(P.pipeline), title: esc(t("pipeline")), value: esc(state.pipeline || t("not_set"))}) +
      row({icon: ICON.line(P.mic), title: esc(t("stt")), value: esc(state.stt ? t("on") : t("off"))}) +
      row({icon: ICON.line(P.speaker), title: esc(t("tts")), value: esc(state.tts ? t("on") : t("off"))}) +
      row({icon: ICON.line(P.mic), title: esc(t("max_voice")), value: esc(t("sec", {n: state.shared.max_voice_seconds}))}) +
      row({icon: ICON.line(P.mail), title: esc(t("cloud_mail")), sub: esc(t("cloud_mail_sub")), value: esc(state.shared.allow_cloud_for_mail ? t("on") : t("off"))});
    $("settings-app").innerHTML =
      row({icon: ICON.line(P.globe), title: esc(t("language")), value: lang === "ru" ? "Русский" : "English"}) +
      row({icon: ICON.line(P.bot), title: esc(t("bot")), value: esc(state.bot_username ? "@" + state.bot_username : "—")}) +
      row({icon: ICON.line(P.help), title: esc(t("help")), chev: true, onClick: () => runCommand("help")}) +
      row({icon: ICON.line(P.refresh), title: esc(t("refresh")), sub: esc(t("refresh_sub")), chev: true, onClick: refreshState}) +
      (state.personal ? row({title: esc(t("reset_prefs")), cls: "danger", onClick: resetPrefs}) : "");
  }

  // ---------- actions ----------
  async function apply(promise) {
    try { const data = await promise; if (data.state) { state = data.state; render(); } haptic("ok"); return true; }
    catch (err) { fail(err); render(); return false; }
  }
  async function runCommand(command, args) {
    try { await api("command", {command, args: args || []}); haptic("ok"); toast(t("sent")); }
    catch (err) { fail(err); }
  }
  async function newConversation() { if (await apply(api("new_conversation"))) toast(t("new_conv_done")); }
  async function refreshState(silent) { return apply(api("state")).then(ok => { if (ok && !silent) toast(t("refreshed")); return ok; }); }
  function cancelReminders() {
    const go = () => apply(api("cancel_reminders"));
    if (tg && tg.showConfirm && !preview) tg.showConfirm(t("confirm_cancel"), ok => ok && go());
    else go();
  }

  const sw = on => `<span class="switch ${on ? "on" : ""}" role="switch" aria-checked="${on ? "true" : "false"}"><span></span></span>`;
  async function setPrefs(prefs, quiet) { const ok = await apply(api("set_prefs", {prefs})); if (ok && !quiet) toast(t("saved")); return ok; }
  function resetPrefs() {
    const go = async () => { if (await apply(api("set_prefs", {prefs: {reset: true}}))) toast(t("reset_done")); };
    if (tg && tg.showConfirm && !preview) tg.showConfirm(t("confirm_reset"), ok => ok && go());
    else go();
  }
  function openAddBriefing() {
    const kinds = ["morning", "evening"];
    openSheet(t("add_briefing"), kinds.map(k => row({
      title: esc(t("brief_" + k)),
      sub: esc(t("brief_" + k + "_sub")),
      chev: true,
      onClick: async () => {
        closeSheet();
        const time = k === "evening" ? "20:00" : "08:00";
        const newPlan = {kind: k, time, enabled: true, name: ""};
        const idx = (state.briefings || []).length;
        if (await setPrefs({briefings: (state.briefings || []).concat([newPlan])}, true))
          openTime(t("time"), time, v => updateBriefing(idx, {time: v}));
      },
    })).join(""));
  }
  function editBriefing(plan) {
    const idx = (state.briefings || []).findIndex(p => p.id === plan.id);
    if (idx < 0) return;
    const html =
      row({icon: ICON.line(P.bell), title: esc(t("brief_on")), right: sw(plan.enabled),
           onClick: async () => { closeSheet(); await toggleBriefing(idx); }}) +
      row({icon: ICON.line(P.clock), title: esc(t("time")), value: esc(plan.time), chev: true,
           onClick: () => { closeSheet(); openTime(t("time"), plan.time, v => updateBriefing(idx, {time: v})); }}) +
      row({icon: ICON.line(P.edit), title: esc(t("brief_name")), value: esc(plan.name || t("brief_" + plan.kind)), chev: true,
           onClick: () => { closeSheet(); openText(t("brief_name"), plan.name, v => updateBriefing(idx, {name: v})); }}) +
      row({icon: ICON.line(P.trash), title: esc(t("delete_briefing")), cls: "danger", onClick: () => {
        closeSheet();
        const go = () => deleteBriefing(idx);
        const q = t("confirm_delete_briefing", {name: plan.name || t("brief_" + plan.kind)});
        if (tg && tg.showConfirm && !preview) tg.showConfirm(q, ok => ok && go());
        else go();
      }});
    openSheet(t("brief_" + plan.kind), html);
  }
  async function toggleBriefing(idx) {
    const plans = (state.briefings || []).slice();
    plans[idx] = {...plans[idx], enabled: !plans[idx].enabled};
    return setPrefs({briefings: plans}, true);
  }
  async function updateBriefing(idx, patch) {
    const plans = (state.briefings || []).slice();
    plans[idx] = {...plans[idx], ...patch};
    return setPrefs({briefings: plans});
  }
  async function deleteBriefing(idx) {
    const plans = (state.briefings || []).slice();
    plans.splice(idx, 1);
    return setPrefs({briefings: plans});
  }
  function openText(title, value, onSave) {
    const id = register(() => { const v = $("text-input").value; closeSheet(); if (v) onSave(v.trim()); });
    openSheet(title, `<div class="time-box"><input type="text" id="text-input" value="${esc(value || "")}" maxlength="40" placeholder="${esc(t("brief_name_ph"))}">
      <button class="btn" data-act="${id}">${esc(t("save"))}</button></div>`);
  }
  function openTime(title, value, onSave) {
    const id = register(() => { const v = $("time-input").value; closeSheet(); if (v && v !== value) onSave(v.slice(0, 5)); });
    openSheet(title, `<div class="time-box"><input type="time" id="time-input" value="${esc(value || "")}">
      <button class="btn" data-act="${id}">${esc(t("save"))}</button></div>`);
  }
  function openWeather() {
    const items = [{id: null, name: t("none")}].concat(state.choices.weather);
    openSheet(t("weather"), items.map(w => row({
      title: esc(w.name),
      right: w.id === (state.sources.weather_id || null) ? '<span class="check">✓</span>' : "",
      onClick: async () => { closeSheet(); await setPrefs({weather: w.id}); },
    })).join(""));
  }
  function openMulti(key, title, choices, selected) {
    if (!choices.length) { openSheet(title, `<div class="empty">${esc(t("pool_empty"))}</div>`); return; }
    openSheet(title, choices.map(c => row({
      title: esc(c.name),
      right: selected.includes(c.id) ? '<span class="check">✓</span>' : "",
      onClick: async () => {
        const next = selected.includes(c.id) ? selected.filter(x => x !== c.id) : selected.concat(c.id);
        if (await apply(api("set_prefs", {prefs: {[key]: next}}))) {
          openMulti(key, title, choices, key === "mail" ? state.sources.mail_ids : state.sources.calendar_ids);
        }
      },
    })).join(""));
  }

  function openSheet(title, html) {
    $("sheet-title").textContent = title; $("sheet-body").innerHTML = html;
    $("backdrop").classList.add("open"); $("sheet").classList.add("open");
  }
  function closeSheet() { $("backdrop").classList.remove("open"); $("sheet").classList.remove("open"); }
  window.closeSheet = closeSheet;

  function openModes() {
    const html = state.reply_modes.map(m => row({
      title: esc(modeName(m)),
      right: m === state.reply_mode ? '<span class="check">✓</span>' : "",
      onClick: async () => { closeSheet(); if (m !== state.reply_mode) await apply(api("set_reply_mode", {mode: m})); },
    })).join("");
    openSheet(t("reply_mode"), html);
  }
  window.openAgents = function () {
    if (!state) return;
    const items = [{id: null, name: t("agent_default") + (state.agent.pipeline_name ? " · " + state.agent.pipeline_name : "")}]
      .concat(state.agents);
    const html = items.map(a => row({
      title: esc(a.name),
      right: (a.id === null ? !state.agent.overridden : state.agent.overridden && a.id === state.agent.id) ? '<span class="check">✓</span>' : "",
      onClick: async () => { closeSheet(); await apply(api("set_agent", {agent_id: a.id})); },
    })).join("");
    openSheet(t("agent"), html);
  };
  window.backToChat = function () { if (tg && !preview) tg.close(); };

  // ---------- tabs ----------
  $("tabbar").addEventListener("click", e => {
    const btn = e.target.closest(".tab"); if (!btn) return;
    haptic();
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "page-" + btn.dataset.tab));
    window.scrollTo(0, 0);
  });

  // ---------- theme & start ----------
  function applyTheme() {
    const scheme = tg && tg.colorScheme ? tg.colorScheme
      : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.dataset.theme = scheme;
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    try { tg && tg.setHeaderColor && tg.setHeaderColor("#2f6bff"); tg && tg.setBackgroundColor && tg.setBackgroundColor(bg); } catch (e) {}
  }
  if (tg) {
    tg.ready(); tg.expand();
    tg.onEvent && tg.onEvent("themeChanged", () => { applyTheme(); refreshState(true); });
    tg.onEvent && tg.onEvent("viewportChanged", ({isStateStable}) => {
      if (isStateStable && tg.isExpanded) refreshState(true);
    });
  }
  applyTheme();

  api("state").then(data => { state = data.state; render(); }).catch(err => {
    // Never show sample data as if it were the user's: render an empty state
    // and say why.
    state = {
      first_name: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || "",
      language: DEMO.language, bot_username: null, reply_mode: "text", reply_modes: [],
      tts: false, stt: false, pipeline: null,
      agent: {id: null, name: null, overridden: false, pipeline_name: null}, agents: [],
      personal: false,
      briefings: [],
      brief: {active: [], quiet_start: "", quiet_end: "", has_personal_briefings: false, personal_quiet: false},
      sources: {weather: null, weather_id: null, calendars: [], calendar_ids: [], todo: null, mail: false, mail_ids: [], home: false, personal: false},
      choices: {weather: [], calendars: [], mail: []},
      shared: {max_voice_seconds: 0, keep_audio: false, allow_cloud_for_mail: false},
      account: {id: 0, name: "", username: null}, reminders: [],
    };
    render();
    const banner = $("preview-banner");
    banner.hidden = false;
    banner.textContent = err && err.message === "unauthorized" ? t("unauthorized") : t("error");
  });
})();
</script>
</body>
</html>
