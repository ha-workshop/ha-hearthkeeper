say:
  name: Say
  description: Send a text or voice message to a Telegram chat through Hearthkeeper.
  fields:
    chat_id:
      name: Chat ID
      description: Telegram chat ID the bot is allowed to talk to.
      required: true
      selector:
        number:
          mode: box
    text:
      name: Text
      description: Message to send. It is spoken when the mode is voice or both.
      required: true
      selector:
        text:
          multiline: true
    mode:
      name: Mode
      description: Text, voice or both. Defaults to the reply mode of the chat.
      selector:
        select:
          options:
            - text
            - voice
            - both

reset:
  name: Reset
  description: Forget the conversation context of one chat or of every chat.
  fields:
    chat_id:
      name: Chat ID
      description: Chat to reset. Omit to reset every chat.
      selector:
        number:
          mode: box

brief:
  name: Brief
  description: Send the daily briefing now, to one chat or to every known private chat.
  fields:
    chat_id:
      name: Chat ID
      description: Telegram chat to send the briefing to. Omit to send it to every known private chat.
      selector:
        number:
          mode: box
    kind:
      name: Kind
      description: Morning (plan for the day), evening (today's summary) or mail (unread mail digest). Omit for the full briefing.
      selector:
        select:
          options:
            - morning
            - evening
            - mail
