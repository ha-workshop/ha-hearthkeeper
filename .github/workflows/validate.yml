name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile integration
        run: python -m py_compile custom_components/hearthkeeper/*.py
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          import pathlib

          for path in pathlib.Path(
              "custom_components/hearthkeeper"
          ).rglob("*.json"):
              json.loads(path.read_text())
          print("json ok")
          PY
